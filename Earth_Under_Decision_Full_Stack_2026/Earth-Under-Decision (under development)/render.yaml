services:
  - type: web
    name: earth-under-decision
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: earth-under-decision-files
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Earth Under Decision
      - key: LOCAL_STORAGE_ROOT
        value: /app/data
      - key: FRONTEND_DIST_DIR
        value: /app/frontend_dist
      - key: MAX_UPLOAD_SIZE_MB
        value: "500"
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: earth-under-decision-db
          property: connectionString

databases:
  - name: earth-under-decision-db
    databaseName: earth_under_decision
    user: earth_app
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
