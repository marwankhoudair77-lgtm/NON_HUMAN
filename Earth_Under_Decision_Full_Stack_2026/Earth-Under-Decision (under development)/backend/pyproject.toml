[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-under-decision-backend"
version = "0.1.0"
description = "Scientific and geospatial API for Earth Under Decision"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "rasterio>=1.4,<2.0",
  "xarray>=2024.6",
  "h5py>=3.11",
  "h5netcdf>=1.3",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.13,<2.0",
  "statsmodels>=0.14,<1.0",
  "shapely>=2.0,<3.0",
  "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
hdf4 = ["pyhdf>=0.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
